<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ede6db" />
  <title>Rick's Closet — 3D Interactive Clothes Collection</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap"
    rel="stylesheet" />
</head>

<body class="mode-carousel">
  <div id="app">
    <!-- Top Navigation Bar & Suspended Wooden Boutique Sign -->
    <header class="topbar">
      <!-- Left: Reset Button -->
      <div class="topbar-left">
        <button class="icon-btn" id="reset-btn" aria-label="Reset rack" title="Reset View">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.85.99 6.57 2.57L21 8"></path>
            <polyline points="21 3 21 8 16 8"></polyline>
          </svg>
        </button>
      </div>

      <!-- Center: Hanging Wooden Sign -->
      <div class="hanging-sign" aria-label="Rick's Closet">
        <div class="sign-string sign-string-left"></div>
        <div class="sign-string sign-string-right"></div>
        <div class="sign-board">
          <span class="sign-sub">RICK'S</span>
          <strong class="sign-main">Closet</strong>
        </div>
      </div>

      <!-- Right: Sound & Shopping Cart -->
      <div class="topbar-right">
        <button class="icon-btn" id="sound-btn" aria-label="Toggle sound" title="Toggle Sound">
          <svg class="sound-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path class="sound-wave wave-1" d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            <path class="sound-wave wave-2" d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
          </svg>
        </button>
        <button class="bag-btn" id="bag-btn" aria-label="Shopping Cart" title="Open Cart">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
          <span class="bag-count" id="bag-count">0</span>
        </button>
      </div>
    </header>

    <!-- Main 3D Experience Canvas -->
    <main class="viewport-stage" id="stage">
      <div id="webgl-container" aria-label="Interactive 3D clothing display"></div>

      <!-- Subtle Side Stage Chevrons -->
      <button class="edge-nav-btn edge-prev-btn" id="rack-prev-btn" aria-label="Previous garment in rack"
        title="Previous Garment">&lsaquo;</button>
      <button class="edge-nav-btn edge-next-btn" id="rack-next-btn" aria-label="Next garment in rack"
        title="Next Garment">&rsaquo;</button>

      <!-- Return to Closet Button (when in Orbit Mode) -->
      <button class="exit-inspect-btn" id="exit-inspect-btn" aria-label="Return to closet view">
        <span class="arrow">&larr;</span>
        <span>RETURN TO CLOSET</span>
        <span class="key-badge">ESC</span>
      </button>

      <!-- Minimal Center Controls (Directly under active garment) -->
      <div class="boutique-dock" id="boutique-dock">
        <h2 class="dock-title" id="dock-item-title">Faces Shirt</h2>
        <div class="dock-price-row">
          <button class="arrow-nav-btn prev-arrow-btn" id="rotate-left-btn" aria-label="Rotate garment left"
            title="Rotate Left">&#8592;</button>
          <span class="dock-price" id="dock-item-price">₦115,000</span>
          <button class="arrow-nav-btn next-arrow-btn" id="rotate-right-btn" aria-label="Rotate garment right"
            title="Rotate Right">&#8594;</button>
        </div>
        <button class="view-pill-btn" id="view-piece-btn">View</button>
      </div>
    </main>

    <!-- Detail Modal Sheet (Opened via "View" button) with Product Image -->
    <div class="detail-sheet-backdrop" id="detail-backdrop"></div>
    <div class="detail-sheet" id="detail-sheet" aria-hidden="true">
      <div class="detail-sheet-handle"></div>

      <div class="sheet-layout">
        <!-- Left Column: Product Reference Image (Changes with colorway) -->
        <div class="sheet-image-column">
          <div class="sheet-image-frame">
            <img class="sheet-product-img" id="sheet-product-img" alt="Garment Product Preview" />
            <div class="sheet-color-badge" id="sheet-img-color-badge">PITCH BLACK</div>
          </div>
        </div>

        <!-- Right Column: Product Information & Controls -->
        <div class="sheet-info-column">
          <div class="sheet-header">
            <span class="sheet-badge" id="sheet-badge">TOPS · 210 GSM</span>
            <button class="sheet-close-btn" id="sheet-close-btn" aria-label="Close details">&times;</button>
          </div>

          <h1 class="sheet-title" id="sheet-title">Faces Shirt</h1>
          <div class="sheet-price-row">
            <span class="sheet-price" id="sheet-price">₦115,000</span>
            <span class="sheet-usd-price" id="sheet-usd-price">($92.00 USD)</span>
          </div>

          <p class="sheet-desc" id="sheet-desc"></p>

              <!-- Colorway Swatches: Clicking updates the product image and 3D garment! -->
              <div class="sheet-section">
                <div class="sheet-section-label">
                  <span>COLORWAY</span>
                  <strong id="sheet-color-name">Pitch Black</strong>
                </div>
                <div class="sheet-swatches" id="sheet-swatches"></div>
              </div>

              <!-- Size Selector -->
              <div class="sheet-section">
                <div class="sheet-section-label">
                  <span>SELECT SIZE</span>
                  <span class="size-hint">TRUE TO SIZE</span>
                </div>
                <div class="sheet-sizes" id="sheet-sizes">
                  <button class="size-chip" data-size="S">S</button>
                  <button class="size-chip active" data-size="M">M</button>
                  <button class="size-chip" data-size="L">L</button>
                  <button class="size-chip" data-size="XL">XL</button>
                </div>
              </div>

              <!-- Fabric Specs Grid -->
              <div class="sheet-specs-grid">
                <div class="spec-cell">
                  <span class="spec-label">FABRIC</span>
                  <span class="spec-value" id="sheet-fabric">100% Breathable Viscose</span>
                </div>
                <div class="spec-cell">
                  <span class="spec-label">WEIGHT</span>
                  <span class="spec-value" id="sheet-weight">210 GSM</span>
                </div>
                <div class="spec-cell">
                  <span class="spec-label">FIT</span>
                  <span class="spec-value" id="sheet-fit">Relaxed Fluid Fit</span>
                </div>
                <div class="spec-cell">
                  <span class="spec-label">ORIGIN</span>
                  <span class="spec-value" id="sheet-origin">Porto, Portugal</span>
                </div>
              </div>

              <!-- Actions -->
              <div class="sheet-actions">
                <button class="sheet-cta-btn add-to-bag-btn" id="sheet-add-bag-btn">
                  ADD TO CART · <span id="sheet-btn-price">₦115,000</span>
                </button>
                <button class="sheet-inspect-btn" id="sheet-inspect-btn">
                  ORBIT CAMERA 360° &nearr;
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Shopping Cart Drawer -->
        <aside class="bag-drawer" id="bag-drawer" aria-label="Shopping Cart Drawer">
          <div class="drawer-header">
            <h3>YOUR CART (<span id="cart-item-count">0</span>)</h3>
            <button class="close-drawer-btn" id="close-bag-btn" aria-label="Close cart">&times;</button>
          </div>
          <div class="cart-items" id="cart-items">
            <div class="empty-cart-msg">Your shopping cart is empty.</div>
          </div>
          <div class="drawer-footer">
            <div class="cart-total-row">
              <span>SUBTOTAL</span>
              <strong id="cart-subtotal">₦0</strong>
            </div>
            <button class="checkout-btn" id="checkout-btn">PROCEED TO CHECKOUT</button>
          </div>
        </aside>
        <div class="drawer-backdrop" id="drawer-backdrop"></div>

        <!-- Toast Notification -->
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>

      <script type="module" src="/src/main.js"></script>
</body>

</html>
